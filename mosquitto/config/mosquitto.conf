# ==============================================================================
# Configuracao do Eclipse Mosquitto MQTT Broker
# ==============================================================================

# Porta padrao para comunicacao MQTT sem criptografia (TCP)
listener 1883 0.0.0.0

# Permitir conexoes anonimas para fins de teste e laboratorio
allow_anonymous true

# Configuracao de persistencia de mensagens
persistence true
persistence_location /mosquitto/data/

# Configuracao de logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
