# ==============================================================================
# Configuracao do Eclipse Paho MQTT-SN Gateway
# ==============================================================================

# Identificacao do Gateway
GatewayID=1
GatewayName=PahoGateway-01
MaxNumberOfClients=30
KeepAlive=60

# Conexao com o Broker MQTT tradicional (TCP)
# O nome 'mosquitto' corresponde ao nome do servico no compose.yaml
BrokerName=mosquitto
BrokerPortNo=1883
BrokerSecurePortNo=8883

# Modos de operacao
AggregatingGateway=NO
QoS-1=NO
Forwarder=NO
PredefinedTopic=NO
ClientAuthentication=NO

# Parametros da Rede de Sensores (Sensor Network - UDP)
GatewayPortNo=10000
MulticastPortNo=1883
MulticastIP=225.1.1.1
MulticastTTL=1
